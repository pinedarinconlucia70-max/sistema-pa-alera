<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Pañalera</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

    <header class="navbar">
        <h2>Pañalera - Productos</h2>
        <nav>
            <a href="{{ url_for('inicio') }}" class="btn-nav">Inicio</a>
        </nav>
    </header>

    <main class="contenedor-amplio">
        <h2>Gestión de Productos</h2>
        
        
        <form action="" method="POST" class="formulario">
            <div class="campo">
                <label for="nombre">Nombre del Producto:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Pañales Etapa 1" required>
            </div>
            <div class="campo">
                <label for="categoria">Categoría:</label>
                
                <select id="categoria" name="categoria" required>
                    <option value="">Seleccione una categoría...</option>
                    <option value="Pañales">Pañales</option>
                    <option value="Toallitas Húmedas">Toallitas Húmedas</option>
                    <option value="Cremas y Lociones">Cremas y Lociones</option>
                    <option value="Alimentación">Alimentación</option>
                    <option value="Ropa y Accesorios">Ropa y Accesorios</option>
                </select>
            </div>
            <div class="campo">
                <label for="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" name="cantidad" min="1" required>
            </div>
            <div class="campo">
                <label for="fecha_entrada">Fecha de Entrada:</label>
                <input type="date" id="fecha_entrada" name="fecha_entrada" required>
            </div>
            <button type="submit" class="btn">Guardar Producto</button>
        </form>

        <hr style="margin: 2rem 0; border: 0; border-top: 1px solid #ddd;">

    
        <h3>Inventario Actual</h3>
        <table class="tabla-datos">
            <thead>
                <tr>
                    <th>ID Producto</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Cantidad</th>
                    <th>Fecha Entrada</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for p in productos %}
                <tr>
                    <td>{{ p.id_producto }}</td>
                    <td>{{ p.nombre }}</td>
                    <td>{{ p.categoria }}</td>
                    <td>{{ p.cantidad }}</td>
                    <td>{{ p.fecha_entrada }}</td>
                    <td>
                        <a href="{{ url_for('eliminar_producto', id=p.id_producto) }}" onclick="return confirm('¿Eliminar este producto?')" class="btn-eliminar">Eliminar</a>
                        <a href="{{ url_for('editar_producto', id=p.id_producto) }}" class="btn-editar">Editar</a>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </main>

</body>
</html>
