<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ventas - Pañalera</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

    <header class="navbar">
        <h2>Pañalera - Ventas</h2>
        <nav>
            <a href="{{ url_for('inicio') }}" class="btn-nav">Inicio</a>
            
        </nav>
    </header>

    <main class="contenedor-amplio">
        <h2>Registrar Venta</h2>
        
        <form class="formulario" action="/ventas" method="POST">
            <div class="campo">
                <label for="fecha_venta">Fecha de Venta:</label>
                <input type="date" id="fecha_venta" name="fecha_venta" required>
            </div>
            <div class="campo">
                <label for="metodo_pago">Método de Pago:</label>
                <select id="metodo_pago" name="metodo_pago" required>
                    <option value="Efectivo">Efectivo</option>
                    <option value="Nequi">Nequi</option>
                    <option value="Daviplata">Daviplata</option>
                    <option value="Tarjeta">Tarjeta</option>
                </select>
            </div>
            <div class="campo">
                <label for="total">Total ($):</label>
                <input type="number" id="total" name="total" required>
            </div>

            <!-- FK Cliente Dinámico -->
            <div class="campo">
                <label for="id_usuario">Cliente (id_usuario - FK):</label>
                <select id="id_usuario" name="id_usuario" required>
                    <option value="">Seleccione un usuario...</option>
                    {% for u in usuarios %}
                        <option value="{{ u.id_usuario }}">{{ u.id_usuario }} - {{ u.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- FK Producto Dinámico -->
            <div class="campo">
                <label for="id_producto">Producto (id_producto - FK):</label>
                <select id="id_producto" name="id_producto" required>
                    <option value="">Seleccione un producto...</option>
                    {% for p in productos %}
                        <option value="{{ p.id_producto }}">{{ p.id_producto }} - {{ p.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn">Registrar Venta</button>
        </form>

        <hr style="margin: 2rem 0; border: 0; border-top: 1px solid #ddd;">

        <h3>Historial de Ventas</h3>
        <table class="tabla-datos">
            <thead>
                <tr>
                    <th>ID Venta</th>
                    <th>Fecha</th>
                    <th>Método Pago</th>
                    <th>Total ($)</th>
                    <th>Cliente</th>
                    <th>Producto</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                {% for v in ventas %}
                <tr>
                    <td>{{ v.id_venta }}</td>
                    <td>{{ v.fecha_venta }}</td>
                    <td>{{ v.metodo_pago }}</td>
                    <td>${{ v.total }}</td>
                    <td>{{ v.cliente }}</td>
                    <td>{{ v.producto }}</td>
                    <td>
                        <a href="/ventas/eliminar/{{ v.id_venta }}" onclick="return confirm('¿Eliminar esta venta?')" class="btn-eliminar">Eliminar</a>
                        <a href="/ventas/editar/{{ v.id_venta }}" class="btn-editar">Editar</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </main>

</body>
</html>
