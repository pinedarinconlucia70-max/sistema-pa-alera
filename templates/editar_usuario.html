<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <header class="navbar">
        <h2>Editar Usuarios</h2>
        <nav>
            <a href="{{ url_for('inicio') }}" class="btn-nav">Inicio</a>
            <a href="{{ url_for('usuarios') }}" class="btn-nav">Usuarios</a>
        </nav>
    </header>

    <main class="contenedor-formulario">
        <div class="tarjeta-formulario">
            <h2>Modificar Información</h2>

        <form action="" method="POST">
           <form action="" method="POST" class="formulario">
            <div class="campo">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" value="{{usuario.nombre}}" required>
            </div>
            <div class="campo">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" value="{{usuario.correo}}" required>
            </div>
            <div class="acciones-form">
                <button type="submit" class="btn">Actualizar</button>
                <a href="{{ url_for('usuarios') }}" class="btn-cancelar">Cancelar</a>
            </div>
    
        </form>
    </div>
</body>
</html>
